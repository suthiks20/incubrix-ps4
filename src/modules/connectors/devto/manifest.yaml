# Dev.to connector metadata and native article limits.
# The manifest is validated at startup before contract routes are available.
key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image, video_link]
    spec: {title_max_chars: 128, body_max_chars: 100000, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 30}
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url
