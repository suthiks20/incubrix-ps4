key: lemmy
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 200
      body_max_chars: 10000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 30
    per_seconds: 30
capabilities: [publish, status, delete]
error_map:
  '401': CONNECTION_AUTH_EXPIRED
  '429': PLATFORM_RATE_LIMIT
instance_param: base_url
