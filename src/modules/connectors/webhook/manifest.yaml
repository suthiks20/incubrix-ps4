# Webhook connector metadata for signed partner publishing.
# The list-shaped surfaces field is the connector manifest contract.
key: webhook
version: 1.0.0
tier: protocol
auth: none
surfaces:
  - key: post
    content_types: [text]
    spec: {title_max_chars: 300, body_max_chars: 20000, links_allowed: true}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url
