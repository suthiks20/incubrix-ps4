# Compose reads an optional .env for overrides; defaults below keep clean clones runnable.
# Phase 1 contains only the API and its PostgreSQL dependency.
# Later phases will add MinIO, Lemmy, Ghost, and their required databases here.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://ix:ix@postgres:5432/ix}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      API_TOKEN: ${API_TOKEN:-}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://ix:ix@postgres:5432/ix_test}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      IDEMPOTENCY_WAIT_MS: ${IDEMPOTENCY_WAIT_MS:-5000}
      IDEMPOTENCY_LOCK_TTL_SECONDS: ${IDEMPOTENCY_LOCK_TTL_SECONDS:-60}
      CONNECTOR_HTTP_TIMEOUT_MS: ${CONNECTOR_HTTP_TIMEOUT_MS:-10000}
      CONNECTOR_MAX_BACKOFF_MS: ${CONNECTOR_MAX_BACKOFF_MS:-5000}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-60}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: ${STORAGE_DIR:-/app/data/storage}
      CERT_TEST_POST_TTL_MINUTES: ${CERT_TEST_POST_TTL_MINUTES:-10}
      CERT_JANITOR_INTERVAL_SECONDS: ${CERT_JANITOR_INTERVAL_SECONDS:-60}
      CERT_ALLOWED_HOSTS: ${CERT_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CONNECTORS_DISABLED: ${CONNECTORS_DISABLED:-}
    volumes:
      - certdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ix
      POSTGRES_PASSWORD: ix
      POSTGRES_DB: ix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ix"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  certdata:
