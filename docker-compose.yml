# Compose reads an optional .env for overrides; defaults below keep clean clones runnable.
# The default stack contains the API, PostgreSQL and an S3-compatible storage service
# (SeaweedFS, Apache-2.0). The service is named "minio" so existing S3_ENDPOINT settings keep working.
# Local Lemmy and Ghost instances are opt-in through the local-instances profile.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8000}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://ix:ix@postgres:5432/ix}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      API_TOKEN: ${API_TOKEN:-}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://ix:ix@postgres:5432/ix_test}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      IDEMPOTENCY_WAIT_MS: ${IDEMPOTENCY_WAIT_MS:-5000}
      IDEMPOTENCY_LOCK_TTL_SECONDS: ${IDEMPOTENCY_LOCK_TTL_SECONDS:-60}
      CONNECTOR_HTTP_TIMEOUT_MS: ${CONNECTOR_HTTP_TIMEOUT_MS:-10000}
      CONNECTOR_MAX_BACKOFF_MS: ${CONNECTOR_MAX_BACKOFF_MS:-5000}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-60}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_DIR: ${STORAGE_DIR:-/app/data/storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-incubrix}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      CERT_TEST_POST_TTL_MINUTES: ${CERT_TEST_POST_TTL_MINUTES:-10}
      CERT_JANITOR_INTERVAL_SECONDS: ${CERT_JANITOR_INTERVAL_SECONDS:-60}
      CERT_ALLOWED_HOSTS: ${CERT_ALLOWED_HOSTS:-127.0.0.1,localhost,lemmy,ghost}
      CONNECTORS_DISABLED: ${CONNECTORS_DISABLED:-}
      JOBS_POLL_INTERVAL_MS: ${JOBS_POLL_INTERVAL_MS:-1000}
      JOBS_MAX_ATTEMPTS: ${JOBS_MAX_ATTEMPTS:-3}
      JOBS_STALE_SECONDS: ${JOBS_STALE_SECONDS:-300}
      JOBS_CALLBACK_SECRET: ${JOBS_CALLBACK_SECRET:-dev-callback-secret}
      JOBS_CALLBACK_TIMEOUT_MS: ${JOBS_CALLBACK_TIMEOUT_MS:-5000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CONNECTION_LEMMY_LOCAL: ${CONNECTION_LEMMY_LOCAL:-}
      CONNECTION_GHOST_LOCAL: ${CONNECTION_GHOST_LOCAL:-}
      
    volumes:
      - certdata:/app/data
      - ./evidence:/app/evidence
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ix
      POSTGRES_PASSWORD: ix
      POSTGRES_DB: ix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ix"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  minio-init:
    build: .
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-incubrix}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["node", "scripts/initBucket.js"]
  lemmy-db:
    profiles: [local-instances]
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: lemmy-spike-password
    mem_limit: 512m
    volumes:
      - lemmy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy -d lemmy"]
      interval: 5s
      timeout: 3s
      retries: 30
  pictrs:
    profiles: [local-instances]
    image: asonix/pictrs:0.5.19
    mem_limit: 256m
    volumes:
      - pictrs:/mnt
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 15
  lemmy:
    profiles: [local-instances]
    image: dessalines/lemmy:0.19.12
    depends_on:
      lemmy-db:
        condition: service_healthy
      pictrs:
        condition: service_started
    mem_limit: 512m
    ports:
      - "8536:8536"
    volumes:
      - ./bootstrap/lemmy.hjson:/config/config.hjson:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8536/api/v3/site >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  ghost:
    profiles: [local-instances]
    image: ghost:6.0.10-alpine
    mem_limit: 1g
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: development
      url: http://ghost:2368
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
    volumes:
      - ghost-data:/var/lib/ghost/content
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:2368/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 15s
      retries: 40
volumes:
  pgdata:
  certdata:
  lemmy-db:
  pictrs:
  ghost-data:
  minio-data: