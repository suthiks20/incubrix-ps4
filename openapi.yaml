openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Destination Network API
  version: 1.0.0
  description: The service exposes health, destination catalogue, rules, certification and job orchestration routes.
servers:
  - url: http://localhost:8000
paths:
  /:
    get:
      summary: Public service discovery
      responses:
        '200':
          description: Service metadata and public links
          content:
            application/json:
              schema:
                type: object
                required: [name, version, mode, links]
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  mode:
                    type: string
                    enum: [simulation, live]
                  links:
                    type: object
                    required: [health, ready, openapi, reviewer_guide]
                    properties:
                      health: { type: string }
                      ready: { type: string }
                      openapi: { type: string }
                      reviewer_guide: { type: string }
  /openapi.yaml:
    get:
      summary: Download the OpenAPI document
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/NotReady'
  /api/v1/health:
    get:
      summary: API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      summary: API readiness
      responses:
        '200':
          description: API ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/NotReady'
  /api/v1/connectors:
    get:
      summary: List connector manifests
      responses:
        '200':
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorManifest'
  /api/v1/destinations:
    get:
      summary: List destinations
      responses:
        '200':
          description: Destination catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
    post:
      summary: Create destination
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPayload'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/destinations/{id}:
    get:
      summary: Fetch destination by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Destination record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
    put:
      summary: Update destination
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationPayload'
      responses:
        '200':
          description: Updated destination
    delete:
      summary: Delete destination
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Destination removed
  /api/v1/destinations/{id}/certify:
    post:
      summary: Run destination certification
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '202':
          description: Certification job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
  /api/v1/tailor:
    post:
      summary: Tailor a rendition for a destination
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorRequest'
      responses:
        '200':
          description: Tailored rendition result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailorResponse'
  /api/v1/destinations/{id}/rules/capture:
    post:
      summary: Capture a pending rule proposal
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCaptureRequest'
      responses:
        '200':
          description: Pending proposal captured
  /api/v1/destinations/{id}/rules/confirm:
    post:
      summary: Confirm a pending rule proposal
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Proposal confirmed
  /api/v1/certification/runs:
    get:
      summary: List certification runs
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Certification run list
  /api/v1/certification/runs/{id}:
    get:
      summary: Fetch one certification run
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Certification run record
  /api/v1/certification/runs/{id}/evidence:
    get:
      summary: Download certification evidence
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Evidence JSON
  /api/v1/alerts:
    get:
      summary: List certification alerts
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Alerts list
  /api/v1/alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Alert acknowledged
  /api/v1/certification/cleanup:
    post:
      summary: Trigger cleanup of stale certification evidence
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Cleanup request accepted
  /api/v1/certification/summary:
    get:
      summary: Certification summary
      responses:
        '200':
          description: Summary payload
  /api/v1/rules/evaluate:
    post:
      summary: Evaluate rules without publishing
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Evaluation result
  /api/v1/jobs:
    get:
      summary: List jobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Jobs list
    post:
      summary: Create a job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
  /api/v1/selftest:
    post:
      summary: Queue the simulation hard-case self-test
      description: Runs the seeded local mock scenarios and stores a downloadable report.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelftestRequest'
      responses:
        '202':
          description: Self-test job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '501':
          description: Self-test is unavailable outside simulation mode
  /api/v1/jobs/{id}:
    get:
      summary: Fetch job by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job status and result
  /api/v1/jobs/{id}/download/{kind}:
    get:
      summary: Download job output or manifest
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [output, manifest, errors, report]
      responses:
        '200':
          description: Downloaded job output, report, manifest, or catalogue error CSV
  /api/v1/catalogue/import:
    post:
      summary: Import destinations from a CSV upload or URL
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogueImportRequest'
      responses:
        '202':
          description: Catalogue import job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: CSV exceeds the upload size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /feeds/{destination_id}.xml:
    get:
      summary: Read a destination's MRSS video feed
      parameters:
        - in: path
          name: destination_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RSS 2.0 feed with Media RSS items
          content:
            application/rss+xml:
              schema:
                type: string
        '404':
          description: Destination does not exist or is not an MRSS destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /connector/v1/{key}/{method}:
    post:
      summary: Invoke a connector method by key and method name
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
            enum: [discourse, lemmy, devto, ghost, webhook, assisted, mrss, slack, hashnode]
        - in: path
          name: method
          required: true
          schema:
            type: string
            enum: [validate, publish, get_status, delete, fetch_metrics, refresh_auth, build_assist_pack]
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorRequest'
      responses:
        '200':
          description: Connector response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
    XCorrelationId:
      in: header
      name: X-Correlation-Id
      required: false
      schema:
        type: string
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotReady:
      description: Service not ready
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, details]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
    ConnectorManifest:
      type: object
      properties:
        key:
          type: string
        version:
          type: string
        tier:
          type: string
        capabilities:
          type: array
          items:
            type: string
        surfaces:
          type: array
          items:
            type: string
    Destination:
      type: object
      additionalProperties: true
    DestinationPayload:
      type: object
      additionalProperties: true
    ConnectorRequest:
      type: object
      properties:
        rendition:
          type: object
          additionalProperties: true
        destination:
          type: object
          additionalProperties: true
        connection:
          type: object
          additionalProperties: true
        destination_id:
          type: string
        idempotency_key:
          type: string
    ConnectorResponse:
      type: object
      additionalProperties: true
    TailorRequest:
      type: object
      required: [destination, rendition]
      properties:
        destination:
          type: object
          additionalProperties: true
        rendition:
          type: object
          additionalProperties: true
    TailorResponse:
      type: object
      properties:
        tailored_rendition:
          type: object
          additionalProperties: true
        changes:
          type: array
          items:
            type: object
        relevance_score:
          type: integer
        relevance_reason:
          type: string
    RulesCaptureRequest:
      type: object
      properties:
        rules_text:
          type: string
        url:
          type: string
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
        progress:
          type: integer
    JobRequest:
      type: object
      properties:
        type:
          type: string
          enum: [certify, selftest, catalogue_import, batch_publish]
        input:
          oneOf:
            - type: object
              additionalProperties: true
            - $ref: '#/components/schemas/BatchPublishInput'
        callback_url:
          type: string
    BatchPublishInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [destination, rendition, idempotency_key, expected]
            properties:
              case:
                type: string
              destination:
                type: string
                description: Name or ID of a seeded simulation destination.
              mock_scenario:
                type: string
              rendition:
                type: object
                additionalProperties: true
              idempotency_key:
                type: string
              retry:
                type: string
                enum: [timeout]
              expected:
                type: object
                additionalProperties: false
                required: [outcome, code]
                properties:
                  outcome:
                    type: string
                    enum: [published, blocked, rescheduled, failed]
                  code:
                    type: string
    SelftestRequest:
      type: object
      additionalProperties: false
      properties:
        case:
          type: string
          enum:
            - timeout_then_retry
            - rate_limit_reset_honored
            - expired_token
            - content_rejected
            - title_too_long
            - body_too_long
            - media_not_accepted
            - second_post_inside_frequency_cap
            - promotion_to_no_promo_destination
            - renamed_field_demotes_destination
            - partner_revokes_permission
            - non_english_community_mismatch
            - ai_disclosure_auto_appended
            - csv_duplicates_bad_urls_mixed_languages
    CatalogueImportRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [upload]
              properties:
                upload:
                  type: object
                  additionalProperties: false
                  required: [name, content_base64]
                  properties:
                    name:
                      type: string
                    content_base64:
                      type: string
            - type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
