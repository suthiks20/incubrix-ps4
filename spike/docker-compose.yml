# Isolated local-instance spike; all images are exact tags, never floating tags.
# Limits total under the available Docker memory budget while retaining API functionality.
services:
  lemmy-db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: lemmy-spike-password
    mem_limit: 512m
    volumes:
      - lemmy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy -d lemmy"]
      interval: 5s
      timeout: 3s
      retries: 30

  pictrs:
    image: asonix/pictrs:0.5.19
    mem_limit: 256m
    volumes:
      - pictrs:/mnt
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 15

  lemmy:
    image: dessalines/lemmy:0.19.12
    depends_on:
      lemmy-db:
        condition: service_healthy
      pictrs:
        condition: service_started
    mem_limit: 512m
    ports:
      - "8536:8536"
    volumes:
      - ./lemmy.hjson:/config/config.hjson:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8536/api/v3/site >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  ghost:
    image: ghost:6.0.10-alpine
    mem_limit: 1g
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: development
      url: http://localhost:2368
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
    volumes:
      - ghost-data:/var/lib/ghost/content
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:2368/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 15s
      retries: 40

volumes:
  lemmy-db:
  pictrs:
  ghost-data:
